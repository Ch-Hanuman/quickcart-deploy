apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: quickcart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      initContainers:
        - name: wait-for-inventory-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h inventory-db -p 5432 -U inventory -d inventorydb; do
                echo "Waiting for Inventory DB..."
                sleep 5
              done
      containers:
      - name: inventory-service
        image: hanumanchinthapalli/quickcart-inventory-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: inventory-service-config
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
