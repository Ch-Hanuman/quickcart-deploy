services:
  # Inventory PostgreSQL database
  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory-pass
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventorydb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Order PostgreSQL database
  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders-pass
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orderdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Inventory Service
  inventory-service:
    image: quickcart/inventory-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: inventory-db
      DB_PORT: 5432
      DB_NAME: inventorydb
      DB_USER: inventory
      DB_PASSWORD: inventory-pass
    depends_on:
      inventory-db:
        condition: service_healthy
    restart: unless-stopped

  # Order Service
  order-service:
    image: quickcart/order-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: orderdb
      DB_USER: orders
      DB_PASSWORD: orders-pass
    depends_on:
      order-db:
        condition: service_healthy
      inventory-service:
        condition: service_started
    restart: unless-stopped

  # API Gateway
  api-gateway:
    image: quickcart/api-gateway:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
    restart: unless-stopped

volumes:
  inventory-db-data:
  order-db-data:
